[project]
name = "bond-bot"
version = "0.1.0"
description = "Бесплатный Telegram-бот для игры «Шпион» — без пейволлов и подписок"
authors = [{ name = "kadyevsultan521" }]
readme = "README.md"
requires-python = ">=3.12,<4.0"
dependencies = [
    "aiogram (>=3.15.0,<4.0.0)",
    "sqlalchemy[asyncio] (>=2.0.36,<3.0.0)",
    "aiosqlite (>=0.20.0,<0.21.0)",
    "alembic (>=1.14.0,<2.0.0)",
    "pydantic-settings (>=2.7.0,<3.0.0)",
]

[project.scripts]
bond-bot = "bond_bot.__main__:run"

[tool.poetry]
packages = [{ include = "bond_bot", from = "src" }]

[tool.poetry.group.dev.dependencies]
pytest = "^8.3.4"
pytest-asyncio = "^0.25.0"
ruff = "^0.8.4"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["poetry-core>=2.0.0"]
build-backend = "poetry.core.masonry.api"
